api_version: pg_stand/v1
kind: PostgreSQLStand

metadata:
  name: pg-stand-sync

spec:
  postgres:
    version: 18
    superuser: postgres
    initdb_args: "--data-checksums --auth-host=scram-sha-256"
    tls:
      enabled: false
    parameters:
      max_connections: 100
      shared_buffers: 256MB

  topology:
    mode: primary_standby
    replication:
      mode: sync
      username: replicator
      application_name: pg_stand_sync
      max_wal_senders: 10
      max_replication_slots: 10
      wal_keep_size: 256MB
      wal_keep_segments: 64
      hot_standby_feedback: true

  docker:
    pull_policy: missing
    network_name: pg-stand-sync-network-pg-stand-managed
    labels:
      io.pg-stand.profile: primary-standby-sync

  storage:
    root_directory: .pg_stand/pg-stand-sync

  nodes:
    primary:
      container_name: pg-stand-sync-primary-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55435
      ssh_published_port: 56435
      pgbouncer_session_published_port: 57435
      pgbouncer_transaction_published_port: 58435
      shm_size: 512m
      cpu_limit: 1.0
      memory_limit: 1g
    standby:
      container_name: pg-stand-sync-standby-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55436
      ssh_published_port: 56436
      pgbouncer_session_published_port: 57436
      pgbouncer_transaction_published_port: 58436
      shm_size: 512m
      cpu_limit: 1.0
      memory_limit: 1g

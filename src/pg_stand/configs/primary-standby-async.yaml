api_version: pg_stand/v1
kind: PostgreSQLStand

metadata:
  name: pg-stand-async

spec:
  postgres:
    version: 18
    superuser: postgres
    initdb_args: "--data-checksums --auth-host=scram-sha-256"
    tls:
      enabled: false
    parameters:
      max_connections: 100
      shared_buffers: 256MB

  topology:
    mode: primary_standby
    replication:
      mode: async
      username: replicator
      application_name: pg_stand_async
      max_wal_senders: 10
      max_replication_slots: 10
      wal_keep_size: 256MB
      wal_keep_segments: 64
      hot_standby_feedback: true

  docker:
    pull_policy: missing
    network_name: pg-stand-async-network-pg-stand-managed
    labels:
      io.pg-stand.profile: primary-standby-async

  storage:
    root_directory: .pg_stand/pg-stand-async

  nodes:
    primary:
      container_name: pg-stand-async-primary-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55433
      ssh_published_port: 56433
      pgbouncer_session_published_port: 57433
      pgbouncer_transaction_published_port: 58433
      shm_size: 512m
      cpu_limit: 1.0
      memory_limit: 1g
    standby:
      container_name: pg-stand-async-standby-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55434
      ssh_published_port: 56434
      pgbouncer_session_published_port: 57434
      pgbouncer_transaction_published_port: 58434
      shm_size: 512m
      cpu_limit: 1.0
      memory_limit: 1g

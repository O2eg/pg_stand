api_version: pg_stand/v1
kind: PostgreSQLStand
metadata:
  name: pg-stand-logical-source
spec:
  postgres:
    version: 18
    superuser: postgres
    initdb_args: "--data-checksums --auth-host=scram-sha-256"
    logical_decoding:
      max_wal_senders: 10
      max_replication_slots: 10
    parameters:
      max_connections: 100
      shared_buffers: 256MB
  topology:
    mode: single
  docker:
    pull_policy: missing
  nodes:
    primary:
      bind_address: 127.0.0.1
      published_port: 55433
      ssh_published_port: 56433
      pgbouncer_session_published_port: 57433
      pgbouncer_transaction_published_port: 58433
      shm_size: 512m
      cpu_limit: 1.0
      memory_limit: 1g
